<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso do Funcionário - FieldBreak</title>
  <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="icons/site.webmanifest" />
  <script>(function(){var t=localStorage.getItem("ferias_theme");if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}if(t==="dark")document.documentElement.classList.add("dark");})();</script>
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
    }
    .voltar {
      display: inline-block;
      margin-top: 18px;
      font-size: 0.85rem;
      text-decoration: none;
      color: var(--texto-suave);
    }
  </style>
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">🌙</button>

  <div class="login-wrap">
    <div class="login-card card">
      <h1 style="font-size:1.2rem; margin-top:0;">🙋 Acesso do Funcionário</h1>
      <p style="color:var(--texto-suave); font-size:0.88rem;">Informe seu CPF para consultar e programar suas férias.</p>

      <form id="formLogin">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required />
        <button type="submit" class="btn" style="width:100%; margin-top:20px;">Entrar</button>
      </form>

      <div id="msg" class="mensagem"></div>

      <a class="voltar" href="index.html">&larr; Voltar</a>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mask-cpf.js"></script>
  <script>
    aplicarMascaraCPF(document.getElementById("cpf"));

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      msg.className = "mensagem";
      msg.textContent = "";
      try {
        const data = await Api.request("/api/auth", {
          method: "POST",
          auth: false,
          body: { action: "login-funcionario", cpf: document.getElementById("cpf").value },
        });
        Api.setSessao(data.token, "funcionario", data.nome);
        window.location.href = "painel-funcionario.html";
      } catch (err) {
        msg.className = "mensagem erro";
        msg.textContent = err.message || "Não foi possível entrar.";
      }
    });
  </script>
</body>
</html>
