<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas Férias - FieldBreak</title>
  <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="icons/site.webmanifest" />
  <script>(function(){var t=localStorage.getItem("ferias_theme");if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}if(t==="dark")document.documentElement.classList.add("dark");})();</script>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">🌙</button>

  <div class="container">
    <div class="topbar">
      <div>
        <h1>🏖️ Minhas Férias</h1>
        <div class="sub" id="saudacao">Carregando...</div>
      </div>
      <button class="btn secundario pequeno" id="btnSair">Sair</button>
    </div>

    <div class="card" id="cardInfo" style="margin-bottom:20px;">
      <h2 style="margin-top:0; font-size:1rem;">Meus dados</h2>
      <div class="grid cols-4" id="infoGrid"></div>
    </div>

    <div id="areaSolicitacao"></div>

    <div class="card" style="margin-top:20px;">
      <h2 style="margin-top:0; font-size:1rem;">Minhas solicitações</h2>
      <div id="listaSolicitacoes">Carregando...</div>
    </div>

    <footer class="rodape">FieldBreak &middot; Regras conforme CLT (Art. 130, 134 e 143)</footer>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/funcionario.js"></script>
</body>
</html>
