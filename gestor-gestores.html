<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestores</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">🌙</button>

  <div class="container">
    <div class="topbar" id="gestorTopbar"></div>
    <nav class="tabs" id="gestorNav"></nav>

    <div class="card">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
        <h2 style="margin:0; font-size:1rem;">Gestores cadastrados</h2>
        <button type="button" class="btn pequeno" id="btnAbrirNovoGestor">+ Novo gestor</button>
      </div>
      <div id="listaGestores" style="margin-top:16px;">Carregando...</div>
    </div>
  </div>

  <!-- Modal: Novo / Editar gestor -->
  <div class="modal-overlay" id="modalGestor" hidden>
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="tituloFormGestor">Novo gestor</h2>
        <button class="modal-fechar" data-fechar-modal aria-label="Fechar">✕</button>
      </div>
      <div class="modal-body">
        <form id="formGestor">
          <input type="hidden" id="gestorId" value="" />

          <label for="novoUsuario">Usuário</label>
          <input type="text" id="novoUsuario" required />

          <label for="novoNome">Nome</label>
          <input type="text" id="novoNome" />

          <label>Regiões com acesso (nenhuma marcada = acesso a todas)</label>
          <div class="checkbox-grid" id="regioesCheckboxGrid"></div>

          <label for="novaSenhaGestor" id="labelSenhaGestor">Senha (mín. 6 caracteres)</label>
          <input type="password" id="novaSenhaGestor" />
          <label for="confirmarSenhaGestor">Confirmar senha</label>
          <input type="password" id="confirmarSenhaGestor" />
          <p class="hint" id="hintSenhaEdicao" style="display:none;">Deixe em branco para manter a senha atual.</p>
        </form>
        <div id="msgGestor" class="mensagem"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn erro empurrar-esquerda" id="btnExcluirGestor" style="display:none;">Excluir</button>
        <button type="button" class="btn secundario" data-fechar-modal>Cancelar</button>
        <button type="submit" form="formGestor" class="btn" id="btnSalvarGestor">Criar gestor</button>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/changelog-data.js"></script>
  <script src="js/gestor-nav.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/senha-toggle.js"></script>
  <script src="js/tabela-resizavel.js"></script>
  <script src="js/gestor-gestores.js"></script>
</body>
</html>
