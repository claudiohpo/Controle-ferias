<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações - FieldBreak</title>
  <link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
  <link rel="shortcut icon" href="icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="icons/site.webmanifest" />
  <script>(function(){var t=localStorage.getItem("ferias_theme");if(!t){t=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}if(t==="dark")document.documentElement.classList.add("dark");})();</script>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">🌙</button>

  <div class="container">
    <div class="topbar" id="gestorTopbar"></div>
    <nav class="tabs" id="gestorNav"></nav>

    <div class="card" style="max-width:420px;">
      <h2 style="margin-top:0; font-size:1rem;">Trocar minha senha</h2>
      <form id="formSenha">
        <label for="senhaAtual">Senha atual</label>
        <input type="password" id="senhaAtual" required />
        <label for="novaSenha">Nova senha (mín. 6 caracteres)</label>
        <input type="password" id="novaSenha" minlength="6" required />
        <label for="confirmarSenha">Confirmar nova senha</label>
        <input type="password" id="confirmarSenha" minlength="6" required />
        <button type="submit" class="btn" style="margin-top:16px;">Atualizar senha</button>
      </form>
      <div id="msgSenha" class="mensagem"></div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/changelog-data.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/gestor-nav.js"></script>
  <script src="js/senha-toggle.js"></script>
  <script>
    if (renderGestorNav("config")) {
      adicionarToggleSenha("senhaAtual");
      adicionarToggleSenha("novaSenha");
      adicionarToggleSenha("confirmarSenha");

      document.getElementById("formSenha").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msgSenha");
        msg.className = "mensagem";

        const validacao = validarConfirmacaoSenha("novaSenha", "confirmarSenha");
        if (!validacao.valid) {
          msg.className = "mensagem erro";
          msg.textContent = validacao.error;
          return;
        }

        try {
          await Api.request("/api/auth", {
            method: "POST",
            body: {
              action: "trocar-senha-gestor",
              senhaAtual: document.getElementById("senhaAtual").value,
              novaSenha: document.getElementById("novaSenha").value,
            },
          });
          msg.className = "mensagem sucesso";
          msg.textContent = "Senha atualizada com sucesso.";
          document.getElementById("formSenha").reset();
        } catch (err) {
          msg.className = "mensagem erro";
          msg.textContent = err.message;
        }
      });
    }
  </script>
</body>
</html>
