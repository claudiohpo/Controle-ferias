<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitações de Férias - Gestor</title>
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">🌙</button>

  <div class="container">
    <div class="topbar" id="gestorTopbar"></div>
    <nav class="tabs" id="gestorNav"></nav>

    <div class="card">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
        <h2 style="margin:0; font-size:1rem;">Solicitações de férias</h2>
        <select id="filtroStatus">
          <option value="">Todos os status</option>
          <option value="pendente" selected>Pendentes</option>
          <option value="aprovado">Aprovadas</option>
          <option value="rejeitado">Rejeitadas</option>
          <option value="cancelado">Canceladas</option>
        </select>
      </div>
      <div id="listaSolicitacoes" style="margin-top:16px;">Carregando...</div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/gestor-nav.js"></script>
  <script src="js/gestor-ferias.js"></script>
</body>
</html>
